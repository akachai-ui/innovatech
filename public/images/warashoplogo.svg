<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" fill="none">
  <!-- Double Interlocking Infinity Loop Knot (WARA SHOP) -->
  <g transform="translate(40, 20)">
    <!-- Loop 1 (Left-leaning vertical 8) -->
    <path d="M 120 70 C 170 10, 220 50, 180 130 C 140 210, 60 210, 60 290 C 60 360, 150 380, 180 310 C 210 240, 130 180, 120 70 Z" 
          stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Loop 2 (Right-leaning interlocking vertical 8) -->
    <path d="M 120 310 C 70 370, 20 330, 60 250 C 100 170, 180 170, 180 90 C 180 20, 90 0, 60 70 C 30 140, 110 200, 120 310 Z" 
          stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Typography Right -->
  <g fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- WARA -->
    <text x="320" y="165" font-size="78" font-weight="900" letter-spacing="4">WARA</text>
    <!-- SHOP 88 -->
    <text x="320" y="240" font-size="78" font-weight="900" letter-spacing="4">SHOP 88<tspan font-size="36" dy="-30">©</tspan></text>
    <!-- NATWARA DESIGN -->
    <text x="325" y="300" font-size="28" font-weight="600" letter-spacing="8" fill="#e2e8f0">NATWARA DESIGN</text>
  </g>
</svg>
